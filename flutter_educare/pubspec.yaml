name: educare_flutter
description: "Parent-Teacher communication app for Educare Coaching Classes"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core & Services
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  
  # UI & State Management
  table_calendar: ^3.1.2
  intl: ^0.19.0
  provider: ^6.1.2
  lucide_icons: ^0.257.0
  
  # File Downloading, Sharing & Exporting
  url_launcher: ^6.3.0
  path_provider: ^2.1.4
  dio: ^5.7.0
  open_filex: ^4.5.0
  csv: ^6.0.0
  share_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
